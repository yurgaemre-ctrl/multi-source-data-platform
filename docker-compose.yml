services:
  postgres:
    image: postgres:16
    container_name: data-platform-postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    build: .
    image: multi-source-airflow:3.3.1
    container_name: data-platform-airflow

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__PARALLELISM: 4
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    command: airflow standalone

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./tests:/opt/airflow/tests
      - airflow_home:/opt/airflow

    depends_on:
      - postgres

volumes:
  postgres_data:
  airflow_home: